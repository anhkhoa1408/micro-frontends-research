<div class="shell">
  <header class="shell-header">
    <h1>MFE Host</h1>
    <nav class="shell-nav">
      <a routerLink="/react" routerLinkActive="active">React</a>
      <a routerLink="/vue" routerLinkActive="active">Vue</a>
      <a routerLink="/angular" routerLinkActive="active">Angular</a>
    </nav>
    <div class="shell-auth">
      @if (isAuthenticated) {
      <span class="user-info">{{ user?.username }}</span>
      <button class="btn btn-logout" (click)="logout()">Logout</button>
      } @else {
      <a routerLink="/login" class="btn btn-login">Login</a>
      }
    </div>
  </header>

  <main class="shell-main">
    <router-outlet></router-outlet>
  </main>
</div>
